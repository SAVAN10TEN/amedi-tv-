name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ١. جێگیرکرنا Node.js بێی پشتبەستن ل سەر فایلی lock
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ٢. دابەزاندنی کتێبخانەیێن پڕۆژەی
      - name: Install Dependencies
        run: npm install

      # ٣. دروستکرنا فۆڵدەرێ ویب (dist)
      - name: Build Web Assets
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ٤. دابەزاندنا وەشانا جێگیر یا Gradle (8.0)
      - name: Setup Gradle Build Tool
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'

      # ٥. ئەنجامدانی Build بۆ پڕۆژەی
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
