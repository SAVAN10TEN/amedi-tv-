name: Build APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ١. نەچارکرنا سیستەمی بۆ دابەزاندنا وەشانا دروستا Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ٢. دروستکرنەوە و نووکرنا فایلێن Gradle Wrapper یێن کێم د پڕۆژێ تە دا
      - name: Regenerate Gradle Wrapper Files
        run: |
          gradle wrapper --gradle-version 8.5

      # ٣. پێدانی دەسھلات بە فایلی gradlew یێ نوو
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ٤. ئەنجامدانی Build ب ڕێکا Wrapper یێ نوو
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
